<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wgpu Gaussian Splatting Rasterizer</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .help {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 10px 12px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        user-select: none;
        pointer-events: none;
      }

      .export {
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 8px 14px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        cursor: pointer;
      }

      .export:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .help kbd {
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.15);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas" tabindex="0"></canvas>

    <button id="export-btn" class="export">Export</button>

    <div class="help">
      <div>Drop <kbd>.ply/.sog</kbd> file to load</div>
      <div>
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> : Move, hold right
        mouse to look
      </div>
      <div>
        <kbd>E</kbd> / <kbd>Q</kbd> : Up / down, <kbd>Shift</kbd> : Fast, Scroll
        : Speed
      </div>
      <div>
        Hold <kbd>X</kbd> / <kbd>Y</kbd> / <kbd>Z</kbd> + mouse up/down : Rotate
        scene
      </div>
      <div>
        <kbd>1</kbd> / <kbd>2</kbd> : Place measure points, <kbd>3</kbd> : Set
        line length (m)
      </div>
      <div><kbd>R</kbd> : Reset view direction</div>
      <div><kbd>F1</kbd> : Show / hide help</div>
      <div><kbd>Export</kbd> / <kbd>F2</kbd> : Save the rotated scene</div>
    </div>

    <script type="module">
      import init from "./pkg/gaussianxr_editor.js";

      async function main() {
        await init();
      }

      main().catch((err) => {
        console.error(err);
      });
    </script>
  </body>
</html>
