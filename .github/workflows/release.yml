name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: GaussianXR-Editor
  BIN: gaussianxr-editor

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          APP="dist/GaussianXR Editor.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/$BIN" "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>GaussianXR Editor</string>
            <key>CFBundleIdentifier</key><string>com.ladus.gaussianxr-editor</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/Applications
          hdiutil create -volname "GaussianXR Editor" -srcfolder dist -ov -format UDZO \
            "$APP_NAME-$VERSION-${{ matrix.suffix }}.dmg"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          Compress-Archive -Path "target/${{ matrix.target }}/release/$env:BIN.exe" `
            -DestinationPath "$env:APP_NAME-$v-${{ matrix.suffix }}.zip"

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          tar -C "target/${{ matrix.target }}/release" -czf \
            "$APP_NAME-$VERSION-${{ matrix.suffix }}.tar.gz" "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: |
            *.dmg
            *.zip
            *.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
